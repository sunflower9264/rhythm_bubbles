server {
    listen 18088;
    listen [::]:18088;
    server_name _;

    root /var/www/rhythm-bubbles;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /art/ {
        try_files $uri =404;
        expires 30d;
    }

    location /audio/ {
        try_files $uri =404;
        default_type audio/wav;
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
